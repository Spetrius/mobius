# Mobius NVIDIA settings (580 legacy driver, desktop card driving the screens)
# Keep VRAM contents across suspend (needs nvidia-suspend/resume/hibernate, enabled by the installer)
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
# Wayland needs kernel modesetting; fbdev gives a proper console on the NVIDIA outputs
options nvidia_drm modeset=1 fbdev=1
