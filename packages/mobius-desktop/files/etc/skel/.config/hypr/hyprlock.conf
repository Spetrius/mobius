# Mobius lock screen: blurred desktop, amber clock and date, green password field
general {
    hide_cursor = true
}
background {
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}
label {
    text = $TIME
    color = rgb(e0b050)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}
label {
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(e0b050)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}
input-field {
    size = 320, 52
    position = 0, -40
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgba(3a9922ee)
    inner_color = rgba(062000ee)
    font_color = rgb(e3f2dc)
    check_color = rgb(e0b050)
    fail_color = rgb(e05555)
    capslock_color = rgb(e0b050)
    fail_text = Wrong password
    placeholder_text = Password for $USER
    dots_center = true
    fade_on_empty = false
}
label {
    text = Mobius
    color = rgba(7a9970cc)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = bottom
}
