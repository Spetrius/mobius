# Mobius hardening. Nothing here affects games, Wine/Proton, Steam or Tailscale.
# Kernel log only for root (it can leak addresses useful to exploits)
kernel.dmesg_restrict = 1
# No loading a replacement kernel at runtime
kernel.kexec_load_disabled = 1
# A process may only ptrace its own children (debuggers still work when they launch the program)
kernel.yama.ptrace_scope = 1
# Don't auto-load obscure TTY line disciplines (old attack surface)
dev.tty.ldisc_autoload = 0
# Stricter checks on files in world-writable sticky directories like /tmp
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0
# Ignore ICMP redirects (nobody legitimate on a home network sends them to a desktop)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.tcp_rfc1337 = 1
