# Builds the Mobius package repo and ISO on GitHub's servers, then publishes:
#   release "repo"    -> the pacman repo installed systems update from
#   release "iso-<date>" -> the installer ISO
# Runs weekly (picks up new Arch packages for the ISO) and on demand.
name: build

on:
  workflow_dispatch:
    inputs:
      iso:
        description: "Also build the ISO"
        type: boolean
        default: true
  schedule:
    - cron: "17 9 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # kernel build is the long pole (~2-3 h on 4 cores)
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Fetch the current repo release (so unchanged packages are not rebuilt)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/repo
          gh release download repo -D out/repo -R "${{ github.repository }}" || echo "no repo release yet"

      - name: Build packages and ISO in an Arch container
        id: build
        env:
          # Signs packages and the database once the secret exists (Settings > Secrets > Actions)
          MOBIUS_SIGNING_KEY: ${{ secrets.MOBIUS_SIGNING_KEY }}
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src -e MOBIUS_SIGNING_KEY \
            -e MOBIUS_GH="${{ github.repository }}" -e BUILD_ISO="${{ github.event_name == 'schedule' || inputs.iso }}" \
            archlinux:base-devel bash -euxc '
              printf "\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n" >> /etc/pacman.conf
              pacman -Syu --noconfirm --needed git archiso sudo
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              sed -i "s/^#MAKEFLAGS.*/MAKEFLAGS=\"-j$(nproc)\"/" /etc/makepkg.conf
              chown -R builder: /src
              sudo --preserve-env=MOBIUS_GH,MOBIUS_SIGNING_KEY -u builder build/build-repo.sh out/repo
              if [ "$BUILD_ISO" = "true" ]; then MOBIUS_GH="$MOBIUS_GH" build/build-iso.sh out/iso; fi
            '

      - name: Test the repo before publishing
        # Dependencies resolve, Hyprland config verifies, scripts parse. See build/test-repo.sh.
        id: test
        if: always() && hashFiles('out/repo/mobius.db.tar.zst') != ''
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:base-devel bash -euxc '
              pacman -Sy --noconfirm --needed archlinux-keyring python
              build/test-repo.sh out/repo
            '

      - name: Publish the pacman repo
        # Tests passed: publish everything. Otherwise upload only the package files (not the
        # database, so machines never see them) to keep finished work such as the 2.5 h kernel:
        # the next run downloads them and skips rebuilding.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view repo >/dev/null 2>&1 || gh release create repo --title "Mobius package repo" --notes "pacman repo: Server = https://github.com/${{ github.repository }}/releases/download/repo"
          [ -f out/repo/mobius.db.tar.zst ] || { echo "nothing built"; exit 0; }
          cd out/repo
          if [ "${{ steps.test.outcome }}" = success ]; then
            sigs=(); for f in *.sig; do [ -e "$f" ] && sigs+=("$f"); done
            gh release upload repo --clobber *.pkg.tar.zst "${sigs[@]}" mobius.db mobius.db.tar.zst mobius.files mobius.files.tar.zst
          else
            sigs=(); for f in *.pkg.tar.zst.sig; do [ -e "$f" ] && sigs+=("$f"); done
            gh release upload repo --clobber *.pkg.tar.zst "${sigs[@]}"
            echo "::error::Tests did not pass: packages cached, repo database NOT published"
            exit 1
          fi

      - name: Publish the ISO
        if: success() && (github.event_name == 'schedule' || inputs.iso)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="iso-$(date +%Y.%m.%d)"
          # A second build on the same day replaces that day's ISO instead of failing
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/iso/*.iso --clobber
          else
            gh release create "$tag" out/iso/*.iso --title "Mobius Linux $(date +%Y.%m.%d)" --notes "Boot it, then run mobius-install."
          fi
